version: "3.9"

services:
  # AI-Enhanced SIEM Pipeline
  siem-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-siem-pipeline
    restart: unless-stopped
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REDIS_URL=redis://redis:6379
      - WAZUH_ALERTS_PATH=/var/ossec/logs/alerts/alerts.json
      - LOG_LEVEL=INFO
    volumes:
      # Mount Wazuh alerts directory (read-only)
      - wazuh-alerts:/var/ossec/logs/alerts:ro
      # Application logs
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - siem-network
    command: ["process", "--watch", "/var/ossec/logs/alerts/alerts.json"]

  # Redis for alert deduplication and caching
  redis:
    image: redis:7-alpine
    container_name: ai-siem-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - siem-network
    command: redis-server --appendonly yes

  # Wazuh Manager (optional - for full stack deployment)
  wazuh-manager:
    image: wazuh/wazuh-manager:4.7.0
    container_name: ai-siem-wazuh
    restart: unless-stopped
    profiles:
      - full-stack
    ports:
      - "1514:1514/udp"
      - "1515:1515"
      - "55000:55000"
    volumes:
      - wazuh-alerts:/var/ossec/logs/alerts
      - wazuh-data:/var/ossec/data
    environment:
      - WAZUH_CLUSTER_DISABLED=true
    networks:
      - siem-network

  # OpenSearch for enriched alert storage (optional)
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: ai-siem-opensearch
    restart: unless-stopped
    profiles:
      - full-stack
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - siem-network

  # OpenSearch Dashboards for visualization (optional)
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.0
    container_name: ai-siem-dashboards
    restart: unless-stopped
    profiles:
      - full-stack
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      - opensearch
    networks:
      - siem-network

volumes:
  redis-data:
  wazuh-alerts:
  wazuh-data:
  opensearch-data:

networks:
  siem-network:
    driver: bridge
